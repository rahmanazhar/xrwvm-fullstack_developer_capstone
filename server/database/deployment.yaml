# MongoDB + Express API for Kubernetes.
#
# app.js defaults to the docker-compose hostname `mongo_db`, which is not a
# legal Kubernetes Service name (underscores are not allowed in RFC 1123
# labels). The api container therefore overrides it with MONGO_URL pointing at
# the `mongo-db` Service below.
#
# Replace <NAMESPACE> with your IBM Container Registry namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-db
  labels:
    app: mongo-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-db
  template:
    metadata:
      labels:
        app: mongo-db
    spec:
      containers:
        - name: mongo
          image: mongo:latest
          ports:
            - containerPort: 27017
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-db
spec:
  selector:
    app: mongo-db
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-api
  labels:
    app: dealership-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dealership-api
  template:
    metadata:
      labels:
        app: dealership-api
    spec:
      containers:
        - name: dealership-api
          image: us.icr.io/<NAMESPACE>/dealership-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3030
          env:
            - name: MONGO_URL
              value: "mongodb://mongo-db:27017/"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: dealership-api
spec:
  selector:
    app: dealership-api
  ports:
    - port: 3030
      targetPort: 3030
